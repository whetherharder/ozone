name: Build Hadoop libhdfs (Highly Optimized - Native Only)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      hadoop_version:
        description: 'Hadoop version to build (e.g., 3.3.6)'
        required: false
        default: '3.3.6'

env:
  HADOOP_VERSION: ${{ github.event.inputs.hadoop_version || '3.3.6' }}
  PROTOBUF_VERSION: '3.21.12'
  JAVA_BUILD_VERSION: '11'
  JAVA_RUNTIME_VERSION: '17'

jobs:
  build-libhdfs:
    name: Build libhdfs native only (use pre-compiled JARs)
    runs-on: macos-13

    steps:
      # ============================================
      # STEP 1: Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: Setup Java (minimal - only for native build)
      # ============================================
      - name: Setup Java 11 (for native compilation only)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      - name: Setup Java 17 (for runtime testing)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: Set Java 11 as active
        run: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "Using Java 11 for build:"
          java -version

      # ============================================
      # STEP 3: Install build dependencies
      # ============================================
      - name: Install build tools and libraries
        run: |
          echo "=== Installing build dependencies ==="
          brew install maven cmake autoconf automake libtool
          brew install openssl@3 snappy zlib lz4 zstd

      # ============================================
      # STEP 4: Install Protocol Buffers
      # ============================================
      - name: Install Protocol Buffers prebuilt binary
        run: |
          echo "=== Installing Protocol Buffers 21.12 prebuilt binary ==="

          cd /tmp
          PROTOC_VERSION="21.12"
          PROTOC_ZIP="protoc-${PROTOC_VERSION}-osx-x86_64.zip"

          wget https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          unzip -q ${PROTOC_ZIP} -d protoc
          sudo cp protoc/bin/protoc /usr/local/bin/
          sudo cp -r protoc/include/* /usr/local/include/
          rm -rf protoc ${PROTOC_ZIP}

          protoc --version
          echo "✅ Protocol Buffers installed"

      # ============================================
      # STEP 5: Setup OpenSSL
      # ============================================
      - name: Setup OpenSSL symlinks
        run: |
          if [ ! -e "/usr/local/include/openssl" ]; then
            cd /usr/local/include
            sudo ln -sf ../opt/openssl@3/include/openssl . || true
          fi

      # ============================================
      # STEP 6: Download pre-compiled Hadoop JARs from Maven Central
      # ============================================
      - name: Download pre-compiled Hadoop JARs from Maven Central
        run: |
          echo "=== Downloading pre-compiled Hadoop JARs from Maven Central ==="
          echo "This skips Java compilation entirely - we only need JARs for runtime!"

          mkdir -p $HOME/hadoop-jars

          # Download only the JARs needed for libhdfs runtime
          cd $HOME/hadoop-jars

          # Core Hadoop JARs needed for libhdfs
          JARS=(
            "org.apache.hadoop:hadoop-common:${HADOOP_VERSION}"
            "org.apache.hadoop:hadoop-hdfs-client:${HADOOP_VERSION}"
            "org.apache.hadoop:hadoop-auth:${HADOOP_VERSION}"
            "commons-logging:commons-logging:1.1.3"
            "com.google.guava:guava:27.0-jre"
            "commons-collections:commons-collections:3.2.2"
            "commons-configuration:commons-configuration:1.6"
            "org.apache.commons:commons-lang3:3.12.0"
            "org.slf4j:slf4j-api:1.7.30"
            "org.slf4j:slf4j-log4j12:1.7.30"
          )

          # Create minimal pom.xml for downloading
          cat > pom.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>temp</groupId>
  <artifactId>hadoop-jar-downloader</artifactId>
  <version>1.0</version>
  <packaging>pom</packaging>

  <dependencies>
EOF

          # Add dependencies
          for jar in "${JARS[@]}"; do
            IFS=':' read -r group artifact version <<< "$jar"
            cat >> pom.xml << EOF
    <dependency>
      <groupId>${group}</groupId>
      <artifactId>${artifact}</artifactId>
      <version>${version}</version>
    </dependency>
EOF
          done

          cat >> pom.xml << 'EOF'
  </dependencies>
</project>
EOF

          # Download JARs with dependencies
          mvn dependency:copy-dependencies -DoutputDirectory=. -DincludeScope=runtime

          echo "✅ Pre-compiled JARs downloaded"
          echo "Downloaded $(ls -1 *.jar | wc -l) JAR files"
          ls -lh *.jar | head -20

      # ============================================
      # STEP 7: Clone Hadoop source (for native code only)
      # ============================================
      - name: Clone Hadoop repository (shallow - for native code only)
        run: |
          echo "=== Cloning Hadoop ${HADOOP_VERSION} (shallow) ==="
          echo "We only need the native C/C++ source code, not Java sources!"

          git clone --depth 1 --branch rel/release-${HADOOP_VERSION} \
            --single-branch \
            https://github.com/apache/hadoop.git $HOME/hadoop-src

          cd $HOME/hadoop-src
          echo "Hadoop version: $(grep '<version>' pom.xml | head -1)"

      # ============================================
      # STEP 8: Apply patches
      # ============================================
      - name: Apply macOS compatibility patches
        run: |
          cd $HOME/hadoop-src

          # Fix cmake_minimum_required in hadoop-common
          CMAKE_FILE="hadoop-common-project/hadoop-common/src/CMakeLists.txt"
          sed -i.bak 's/cmake_minimum_required(VERSION 3.1/cmake_minimum_required(VERSION 3.5/' "$CMAKE_FILE"
          echo "✅ Updated cmake_minimum_required to VERSION 3.5"

          # Apply OpenSSL patch
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-macos-openssl.cmake"
          LINE_NUM=$(grep -n "include(HadoopJNI)" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            LINE_NUM=$(grep -n "cmake_minimum_required" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          fi
          sed "${LINE_NUM}r ${PATCH_FILE}" "$CMAKE_FILE" > "${CMAKE_FILE}.patched"
          mv "${CMAKE_FILE}.patched" "$CMAKE_FILE"
          echo "✅ CMake OpenSSL patch applied"

          # Apply exception.c patch for macOS
          EXCEPTION_PATCH="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-exception-macos.patch"
          patch -p1 < "$EXCEPTION_PATCH"
          echo "✅ exception.c patch applied"

          # Apply OpenSSL 3.x compatibility patch
          OPENSSL_PATCH="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-openssl3-compat.patch"
          patch -p1 < "$OPENSSL_PATCH"
          echo "✅ OpenSSL 3.x compatibility patch applied"

          # Fix cmake_minimum_required in ALL HDFS CMakeLists.txt files
          find hadoop-hdfs-project/hadoop-hdfs-native-client -name "CMakeLists.txt" | \
          while read -r cmake_file; do
            if grep -q "cmake_minimum_required" "$cmake_file"; then
              echo "Updating $cmake_file"
              sed -i.bak 's/cmake_minimum_required(VERSION [0-9]\+\.[0-9]\+/cmake_minimum_required(VERSION 3.5/' "$cmake_file"
            fi
          done
          echo "✅ Updated all HDFS cmake_minimum_required to VERSION 3.5"

      # ============================================
      # STEP 9: Build ONLY native libraries (NO Java compilation!)
      # ============================================
      - name: Build native libraries only (skip all Java compilation)
        run: |
          set -e
          set -o pipefail

          cd $HOME/hadoop-src
          echo "=== Building ONLY native libraries ==="
          echo "Skipping ALL Java compilation - using pre-downloaded JARs!"

          # Setup environment
          export OPENSSL_ROOT_DIR=/usr/local/opt/openssl@3
          export OPENSSL_INCLUDE_DIR=/usr/local/opt/openssl@3/include
          export OPENSSL_LIBRARIES=/usr/local/opt/openssl@3/lib
          export PKG_CONFIG_PATH=/usr/local/opt/openssl@3/lib/pkgconfig
          export PROTOBUF_HOME=/usr/local
          export CMAKE_PREFIX_PATH=/usr/local/opt/openssl@3:/usr/local

          # Build hadoop-common native ONLY (skip Java compilation entirely)
          echo "=== Building hadoop-common native libraries ==="
          mvn clean install -pl hadoop-common-project/hadoop-common \
            -Pnative \
            -DskipTests \
            -Dmaven.compiler.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            -Drat.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=/usr/local/opt/openssl@3 \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.snappy=false \
            -Drequire.zstd=false \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-common.log || true

          # If maven.compiler.skip breaks the build, use compile but skip surefire
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ maven.compiler.skip didn't work, trying alternative approach..."

            # Alternative: compile minimally but skip tests and other phases
            mvn clean install -pl hadoop-common-project/hadoop-common \
              -Pnative \
              -DskipTests \
              -Dmaven.test.skip=true \
              -Dsurefire.skip=true \
              -Dmaven.javadoc.skip=true \
              -Dmaven.source.skip=true \
              -Drat.skip=true \
              -Dcheckstyle.skip=true \
              -Dfindbugs.skip=true \
              -Drequire.openssl=true \
              -Dopenssl.prefix=/usr/local/opt/openssl@3 \
              -Dbundle.openssl=false \
              -Drequire.libwebhdfs=false \
              -Drequire.fuse=false \
              -Drequire.valgrind=false \
              -Drequire.snappy=false \
              -Drequire.zstd=false \
              -Drequire.test.libhdfs=false \
              2>&1 | tee build-common.log

            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "❌ hadoop-common build FAILED"
              exit 1
            fi
          fi

          echo "✅ hadoop-common native built successfully"

          # Build HDFS native client (libhdfs)
          echo "=== Building hadoop-hdfs native libraries ==="
          mvn install -pl hadoop-hdfs-project/hadoop-hdfs-native-client \
            -am \
            -Pnative \
            -DskipTests \
            -Dmaven.test.skip=true \
            -Dsurefire.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            -Drat.skip=true \
            -Dcheckstyle.skip=true \
            -Dfindbugs.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=/usr/local/opt/openssl@3 \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-hdfs.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ hadoop-hdfs-native-client build FAILED"
            exit 1
          fi

          echo "✅ libhdfs built successfully"

      # ============================================
      # STEP 10: Collect artifacts
      # ============================================
      - name: Collect libhdfs artifacts
        run: |
          echo "=== Collecting libhdfs artifacts ==="

          mkdir -p $HOME/libhdfs-artifacts/native
          mkdir -p $HOME/libhdfs-artifacts/jars
          mkdir -p $HOME/libhdfs-artifacts/headers

          # Copy native libraries
          if [ -d $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.dylib \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.a \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
          fi

          if [ -d $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib/libhdfs.* \
               $HOME/libhdfs-artifacts/native/
          fi

          # Copy headers
          if [ -d $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/include ]; then
            cp -r $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/include/* \
               $HOME/libhdfs-artifacts/headers/
          fi

          # Copy pre-downloaded JARs (much faster than compiling!)
          echo "=== Using pre-compiled JARs from Maven Central ==="
          cp $HOME/hadoop-jars/*.jar $HOME/libhdfs-artifacts/jars/

          echo "=== Artifacts collected ==="
          echo "Native libraries:"
          ls -lh $HOME/libhdfs-artifacts/native/
          echo ""
          echo "JARs ($(ls -1 $HOME/libhdfs-artifacts/jars/*.jar | wc -l) files):"
          ls -lh $HOME/libhdfs-artifacts/jars/ | head -10

      # ============================================
      # STEP 11: Verify libhdfs
      # ============================================
      - name: Verify libhdfs artifacts
        run: |
          echo "=== Verifying libhdfs artifacts ==="

          cd $HOME/libhdfs-artifacts/native

          if [ ! -f "libhdfs.dylib" ]; then
            echo "ERROR: libhdfs.dylib not found!"
            exit 1
          fi

          echo "✅ libhdfs.dylib found"
          ls -lh libhdfs.dylib

          if [ ! -f "libhadoop.dylib" ] && [ ! -f "libhadoop.a" ]; then
            echo "ERROR: libhadoop not found!"
            exit 1
          fi

          echo "✅ libhadoop found"

          echo "=== Architecture check ==="
          file libhdfs.dylib

          if ! file libhdfs.dylib | grep -q "x86_64"; then
            echo "ERROR: Wrong architecture!"
            exit 1
          fi

          echo "✅ Architecture: x86_64"

          echo "=== Dependencies ==="
          otool -L libhdfs.dylib

      # ============================================
      # STEP 12: Test with Java 17
      # ============================================
      - name: Test libhdfs with Java 17
        run: |
          echo "=== Testing libhdfs with Java 17 ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "Java version:"
          java -version

          export HADOOP_HOME=$HOME/hadoop-src
          export CLASSPATH=$(find $HOME/libhdfs-artifacts/jars -name "*.jar" | tr '\n' ':')
          export DYLD_LIBRARY_PATH=$HOME/libhdfs-artifacts/native:$JAVA_HOME/lib/server

          cat > /tmp/test_libhdfs.c << 'EOF'
#include "hdfs.h"
#include <stdio.h>

int main() {
    printf("libhdfs smoke test\n");
    printf("libhdfs version compiled successfully\n");

    struct hdfsBuilder *builder = hdfsNewBuilder();
    if (builder) {
        printf("✅ hdfsNewBuilder() works\n");
        hdfsFreeBuilder(builder);
    }

    return 0;
}
EOF

          gcc /tmp/test_libhdfs.c -o /tmp/test_libhdfs \
            -I$HOME/libhdfs-artifacts/headers \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/darwin \
            -L$HOME/libhdfs-artifacts/native \
            -lhdfs \
            -Wl,-rpath,$HOME/libhdfs-artifacts/native

          /tmp/test_libhdfs

          echo "✅ libhdfs test passed with pre-compiled JARs!"

      # ============================================
      # STEP 13: Create package
      # ============================================
      - name: Create libhdfs package
        run: |
          cd $HOME/libhdfs-artifacts

          cat > BUILD_INFO.txt << EOF
Hadoop libhdfs Build Information
================================
Hadoop Version: ${HADOOP_VERSION}
Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
Build Platform: macOS Intel (x86_64)
Build Java: ${JAVA_BUILD_VERSION}
Runtime Java: ${JAVA_RUNTIME_VERSION}
Protocol Buffers: ${PROTOBUF_VERSION}
Build Type: Optimized (native only, pre-compiled JARs)
GitHub Run: ${{ github.run_number }}

Build Optimization:
- Native libraries built from source
- Java JARs downloaded from Maven Central (no Java compilation!)
- Significantly faster build time

Contents:
- native/libhdfs.dylib - HDFS C API library
- native/libhadoop.* - Hadoop native library
- headers/*.h - C header files
- jars/*.jar - Required Java JARs (pre-compiled from Maven Central)

Usage:
  export HADOOP_HOME=/path/to/libhdfs
  export CLASSPATH=\$(find \$HADOOP_HOME/jars -name "*.jar" | tr '\n' ':')
  export DYLD_LIBRARY_PATH=\$HADOOP_HOME/native:\$JAVA_HOME/lib/server

  gcc your_app.c -I\$HADOOP_HOME/headers \\
      -I\$JAVA_HOME/include \\
      -I\$JAVA_HOME/include/darwin \\
      -L\$HADOOP_HOME/native -lhdfs
EOF

          tar -czf libhdfs-${HADOOP_VERSION}-macos-intel-x86_64-optimized.tar.gz \
            native/ headers/ jars/ BUILD_INFO.txt

          shasum -a 256 libhdfs-${HADOOP_VERSION}-macos-intel-x86_64-optimized.tar.gz > \
            libhdfs-${HADOOP_VERSION}-macos-intel-x86_64-optimized.tar.gz.sha256

          echo "=== Package created ==="
          ls -lh *.tar.gz*

      # ============================================
      # STEP 14: Upload artifacts
      # ============================================
      - name: Upload libhdfs package
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-${{ env.HADOOP_VERSION }}-macos-intel-x86_64-optimized
          path: |
            $HOME/libhdfs-artifacts/*.tar.gz
            $HOME/libhdfs-artifacts/*.sha256
            $HOME/libhdfs-artifacts/BUILD_INFO.txt
          retention-days: 30

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-native-only-${{ env.HADOOP_VERSION }}
          path: $HOME/libhdfs-artifacts/native/
          retention-days: 30

      # ============================================
      # STEP 15: Summary
      # ============================================
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ libhdfs Build Successful (Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Optimization" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Native libraries built from source" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Java JARs downloaded from Maven Central (skipped Java compilation!)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Significantly faster build time" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Hadoop Version:** ${{ env.HADOOP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** macOS Intel (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhdfs.dylib\` - HDFS C API library" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhadoop.dylib/a\` - Hadoop native library" >> $GITHUB_STEP_SUMMARY
          echo "- C header files" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-compiled Java JARs from Maven Central" >> $GITHUB_STEP_SUMMARY
