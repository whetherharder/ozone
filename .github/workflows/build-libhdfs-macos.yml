name: Build Hadoop libhdfs (Optimized)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      hadoop_version:
        description: 'Hadoop version to build (e.g., 3.3.6)'
        required: false
        default: '3.3.6'

env:
  HADOOP_VERSION: ${{ github.event.inputs.hadoop_version || '3.3.6' }}
  PROTOBUF_VERSION: '3.21.12'
  JAVA_BUILD_VERSION: '11'
  JAVA_RUNTIME_VERSION: '17'

jobs:
  build-libhdfs:
    name: Build libhdfs only (optimized)
    runs-on: macos-13

    steps:
      # ============================================
      # STEP 1: Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: Check what's already installed
      # ============================================
      - name: Check pre-installed software
        id: check_installed
        run: |
          echo "=== Checking pre-installed software ==="

          # Check Maven
          if command -v mvn &> /dev/null; then
            echo "maven_installed=true" >> $GITHUB_OUTPUT
            echo "✅ Maven already installed: $(mvn -version | head -1)"
          else
            echo "maven_installed=false" >> $GITHUB_OUTPUT
            echo "❌ Maven not found"
          fi

          # Check CMake
          if command -v cmake &> /dev/null; then
            echo "cmake_installed=true" >> $GITHUB_OUTPUT
            echo "✅ CMake already installed: $(cmake --version | head -1)"
          else
            echo "cmake_installed=false" >> $GITHUB_OUTPUT
            echo "❌ CMake not found"
          fi

          # Check autotools
          if command -v autoconf &> /dev/null && command -v automake &> /dev/null; then
            echo "autotools_installed=true" >> $GITHUB_OUTPUT
            echo "✅ Autotools already installed"
          else
            echo "autotools_installed=false" >> $GITHUB_OUTPUT
            echo "❌ Autotools not found"
          fi

          # Check OpenSSL 3
          if brew list openssl@3 &> /dev/null; then
            echo "openssl_installed=true" >> $GITHUB_OUTPUT
            echo "✅ OpenSSL@3 already installed"
          else
            echo "openssl_installed=false" >> $GITHUB_OUTPUT
            echo "❌ OpenSSL@3 not found"
          fi

          # Check compression libs
          COMPRESSION_INSTALLED=true
          for lib in snappy zlib lz4 zstd; do
            if ! brew list "$lib" &> /dev/null 2>&1; then
              COMPRESSION_INSTALLED=false
              echo "❌ $lib not found"
            fi
          done

          if [ "$COMPRESSION_INSTALLED" = "true" ]; then
            echo "compression_installed=true" >> $GITHUB_OUTPUT
            echo "✅ Compression libraries already installed"
          else
            echo "compression_installed=false" >> $GITHUB_OUTPUT
          fi

          # Show disk space
          echo "=== Disk Space Before ==="
          df -h /

      # ============================================
      # STEP 3: Install only missing dependencies
      # ============================================
      - name: Install missing build tools
        if: steps.check_installed.outputs.maven_installed != 'true' || steps.check_installed.outputs.cmake_installed != 'true' || steps.check_installed.outputs.autotools_installed != 'true'
        run: |
          echo "=== Installing missing build tools ==="

          # Only install what's missing
          PACKAGES=""

          if [ "${{ steps.check_installed.outputs.maven_installed }}" != "true" ]; then
            PACKAGES="$PACKAGES maven"
          fi

          if [ "${{ steps.check_installed.outputs.cmake_installed }}" != "true" ]; then
            PACKAGES="$PACKAGES cmake"
          fi

          if [ "${{ steps.check_installed.outputs.autotools_installed }}" != "true" ]; then
            PACKAGES="$PACKAGES autoconf automake libtool"
          fi

          if [ -n "$PACKAGES" ]; then
            echo "Installing: $PACKAGES"
            brew install $PACKAGES
          else
            echo "All build tools already installed"
          fi

      - name: Install missing compression libraries
        if: steps.check_installed.outputs.compression_installed != 'true'
        run: |
          echo "=== Installing missing compression libraries ==="

          # Only install missing libs
          for lib in snappy zlib lz4 zstd; do
            if ! brew list "$lib" &> /dev/null 2>&1; then
              echo "Installing $lib..."
              brew install "$lib"
            fi
          done

      - name: Install OpenSSL 3 if missing
        if: steps.check_installed.outputs.openssl_installed != 'true'
        run: |
          echo "=== Installing OpenSSL 3 ==="
          brew install openssl@3

      # ============================================
      # STEP 4: Setup Java (check installed first)
      # ============================================
      - name: Check Java installations
        id: check_java
        run: |
          echo "=== Checking Java installations ==="

          if /usr/libexec/java_home -v 11 &> /dev/null; then
            echo "java11_installed=true" >> $GITHUB_OUTPUT
            echo "✅ Java 11 already installed"
          else
            echo "java11_installed=false" >> $GITHUB_OUTPUT
            echo "❌ Java 11 not found"
          fi

          if /usr/libexec/java_home -v 17 &> /dev/null; then
            echo "java17_installed=true" >> $GITHUB_OUTPUT
            echo "✅ Java 17 already installed"
          else
            echo "java17_installed=false" >> $GITHUB_OUTPUT
            echo "❌ Java 17 not found"
          fi

      - name: Setup Java 11 (build)
        if: steps.check_java.outputs.java11_installed != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      - name: Setup Java 17 (runtime)
        if: steps.check_java.outputs.java17_installed != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: Set Java 11 as active
        run: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "Using Java 11 for build:"
          java -version

      # ============================================
      # STEP 5: Protocol Buffers (install prebuilt binary)
      # ============================================
      - name: Install Protocol Buffers prebuilt binary
        run: |
          echo "=== Installing Protocol Buffers 21.12 prebuilt binary ==="

          cd /tmp

          # Download prebuilt binary for macOS x86_64
          PROTOC_VERSION="21.12"
          PROTOC_ZIP="protoc-${PROTOC_VERSION}-osx-x86_64.zip"

          wget https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}

          # Extract
          unzip -q ${PROTOC_ZIP} -d protoc

          # Install to /usr/local
          sudo cp protoc/bin/protoc /usr/local/bin/
          sudo cp -r protoc/include/* /usr/local/include/

          # Cleanup
          rm -rf protoc ${PROTOC_ZIP}

          # Verify installation
          protoc --version
          echo "✅ Protocol Buffers installed"

      # ============================================
      # STEP 6: Setup OpenSSL
      # ============================================
      - name: Setup OpenSSL symlinks
        run: |
          if [ ! -e "/usr/local/include/openssl" ]; then
            cd /usr/local/include
            sudo ln -sf ../opt/openssl@3/include/openssl . || true
          fi

      # ============================================
      # STEP 7: Clone Hadoop (shallow clone)
      # ============================================
      - name: Clone Hadoop repository (shallow)
        run: |
          echo "=== Cloning Hadoop ${HADOOP_VERSION} (shallow) ==="
          git clone --depth 1 --branch branch-${HADOOP_VERSION} \
            --single-branch \
            https://github.com/apache/hadoop.git $HOME/hadoop-src

          cd $HOME/hadoop-src
          echo "Hadoop version: $(grep '<version>' pom.xml | head -1)"

          # Show repository size
          du -sh $HOME/hadoop-src

      # ============================================
      # STEP 7.5: Cache Maven dependencies
      # ============================================
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          # Key based on Hadoop version - dependencies don't change for same version
          key: ${{ runner.os }}-maven-hadoop-${{ env.HADOOP_VERSION }}-v1
          restore-keys: |
            ${{ runner.os }}-maven-hadoop-${{ env.HADOOP_VERSION }}-
            ${{ runner.os }}-maven-hadoop-

      # ============================================
      # STEP 8: Apply minimal patch
      # ============================================
      - name: Apply macOS OpenSSL patch
        run: |
          cd $HOME/hadoop-src
          CMAKE_FILE="hadoop-common-project/hadoop-common/src/CMakeLists.txt"

          # Check if file exists
          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt not found at $CMAKE_FILE"
            exit 1
          fi

          cp "$CMAKE_FILE" "${CMAKE_FILE}.backup"

          # Fix cmake_minimum_required version (CMake < 3.5 is not supported anymore)
          sed -i.bak 's/cmake_minimum_required(VERSION 3.1/cmake_minimum_required(VERSION 3.5/' "$CMAKE_FILE"
          echo "✅ Updated cmake_minimum_required to VERSION 3.5"

          # Find line to insert patch after - try multiple patterns
          # Pattern 1: After include(HadoopJNI) - this is where JNI is configured
          LINE_NUM=$(grep -n "include(HadoopJNI)" "$CMAKE_FILE" | head -1 | cut -d: -f1)

          # Pattern 2: After find_package(ZLIB - alternative location
          if [ -z "$LINE_NUM" ]; then
            echo "INFO: 'include(HadoopJNI)' not found, trying find_package(ZLIB..."
            LINE_NUM=$(grep -n "find_package(ZLIB" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          fi

          # Pattern 3: After cmake_minimum_required - last resort
          if [ -z "$LINE_NUM" ]; then
            echo "INFO: 'find_package(ZLIB' not found, trying cmake_minimum_required..."
            LINE_NUM=$(grep -n "cmake_minimum_required" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          fi

          if [ -z "$LINE_NUM" ]; then
            echo "ERROR: Could not find suitable location to insert OpenSSL patch"
            echo "Content of CMakeLists.txt (first 50 lines):"
            head -50 "$CMAKE_FILE"
            exit 1
          fi

          echo "✅ Found insertion point at line $LINE_NUM"

          # Apply OpenSSL patch from separate file
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-macos-openssl.cmake"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: Patch file not found: $PATCH_FILE"
            exit 1
          fi

          # Use sed to insert patch file after LINE_NUM
          sed "${LINE_NUM}r ${PATCH_FILE}" "$CMAKE_FILE" > "${CMAKE_FILE}.patched"

          mv "${CMAKE_FILE}.patched" "$CMAKE_FILE"
          echo "=== Patch applied successfully ==="

      # ============================================
      # STEP 9: Setup minimal build environment
      # ============================================
      - name: Setup build environment
        run: |
          echo "OPENSSL_ROOT_DIR=/usr/local/opt/openssl@3" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/local/opt/openssl@3/include" >> $GITHUB_ENV
          echo "OPENSSL_LIBRARIES=/usr/local/opt/openssl@3/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV
          echo "PROTOBUF_HOME=/usr/local" >> $GITHUB_ENV

          # Reduced Maven memory for libhdfs-only build
          echo "MAVEN_OPTS=-Xms256m -Xmx1536m -XX:MaxMetaspaceSize=256m" >> $GITHUB_ENV

          echo "CMAKE_PREFIX_PATH=/usr/local/opt/openssl@3:/usr/local" >> $GITHUB_ENV

      # ============================================
      # STEP 10: Build ONLY libhdfs (minimal)
      # ============================================
      - name: Build libhdfs only
        run: |
          set -e  # Exit on any error
          set -o pipefail  # Exit code from pipe is the exit code of first failed command

          cd $HOME/hadoop-src
          echo "=== Building libhdfs ONLY (minimal build) ==="
          echo "This will build only hadoop-common and hadoop-hdfs native libraries"

          # Clean
          mvn clean -pl hadoop-common-project/hadoop-common,hadoop-hdfs-project/hadoop-hdfs-native-client

          # Build ONLY required modules for libhdfs
          # -pl: specify modules to build
          # -am: build dependencies
          # -Pnative: enable native build
          # -Drequire.libwebhdfs=false: skip libwebhdfs
          # -Drequire.fuse=false: skip fuse
          # -Drequire.valgrind=false: skip valgrind
          # -Drequire.snappy=false: skip snappy (optional for libhdfs)

          mvn install -pl hadoop-common-project/hadoop-common \
            -am \
            -Pnative \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=/usr/local/opt/openssl@3 \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.snappy=false \
            -Drequire.zstd=false \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-common.log

          # Check if build succeeded
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ hadoop-common build FAILED"
            exit 1
          fi

          echo "✅ hadoop-common built successfully"

          # Build HDFS native client (contains libhdfs)
          mvn install -pl hadoop-hdfs-project/hadoop-hdfs-native-client \
            -am \
            -Pnative \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=/usr/local/opt/openssl@3 \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-hdfs.log

          # Check if build succeeded
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ hadoop-hdfs-native-client build FAILED"
            exit 1
          fi

          echo "✅ libhdfs built successfully"

          # Show disk space after build
          echo "=== Disk Space After Build ==="
          df -h /

      # ============================================
      # STEP 11: Collect libhdfs artifacts
      # ============================================
      - name: Collect libhdfs artifacts
        run: |
          echo "=== Collecting libhdfs artifacts ==="

          mkdir -p $HOME/libhdfs-artifacts/native
          mkdir -p $HOME/libhdfs-artifacts/jars
          mkdir -p $HOME/libhdfs-artifacts/headers

          # Copy native libraries from hadoop-common
          if [ -d $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.dylib \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.a \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
          fi

          # Copy libhdfs from hadoop-hdfs-native-client
          if [ -d $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib/libhdfs.* \
               $HOME/libhdfs-artifacts/native/
          fi

          # Copy headers
          if [ -d $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/include ]; then
            cp -r $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/include/* \
               $HOME/libhdfs-artifacts/headers/
          fi

          # Copy required JARs for libhdfs
          cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/hadoop-common-*.jar \
             $HOME/libhdfs-artifacts/jars/ 2>/dev/null || true
          cp $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-client/target/hadoop-hdfs-client-*.jar \
             $HOME/libhdfs-artifacts/jars/ 2>/dev/null || true

          echo "=== Artifacts collected ==="
          ls -lR $HOME/libhdfs-artifacts/

      # ============================================
      # STEP 12: Verify libhdfs
      # ============================================
      - name: Verify libhdfs artifacts
        run: |
          echo "=== Verifying libhdfs artifacts ==="

          cd $HOME/libhdfs-artifacts/native

          # Check libhdfs exists
          if [ ! -f "libhdfs.dylib" ]; then
            echo "ERROR: libhdfs.dylib not found!"
            exit 1
          fi

          echo "✅ libhdfs.dylib found"
          ls -lh libhdfs.dylib

          # Check libhadoop exists
          if [ ! -f "libhadoop.dylib" ] && [ ! -f "libhadoop.a" ]; then
            echo "ERROR: libhadoop not found!"
            exit 1
          fi

          echo "✅ libhadoop found"

          # Check architecture
          echo "=== Architecture check ==="
          file libhdfs.dylib

          if ! file libhdfs.dylib | grep -q "x86_64"; then
            echo "ERROR: Wrong architecture!"
            exit 1
          fi

          echo "✅ Architecture: x86_64"

          # Check dependencies
          echo "=== Dependencies ==="
          otool -L libhdfs.dylib

          # Check for JVM dependency
          if ! otool -L libhdfs.dylib | grep -q "libjvm"; then
            echo "WARNING: No libjvm dependency found"
          else
            echo "✅ JVM dependency found"
          fi

      # ============================================
      # STEP 13: Test with Java 17
      # ============================================
      - name: Test libhdfs with Java 17
        run: |
          echo "=== Testing libhdfs with Java 17 ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "Java version:"
          java -version

          # Setup environment for libhdfs test
          export HADOOP_HOME=$HOME/hadoop-src
          export CLASSPATH=$(find $HOME/libhdfs-artifacts/jars -name "*.jar" | tr '\n' ':')
          export DYLD_LIBRARY_PATH=$HOME/libhdfs-artifacts/native:$JAVA_HOME/lib/server

          # Create simple test
          cat > /tmp/test_libhdfs.c << 'EOF'
          #include "hdfs.h"
          #include <stdio.h>

          int main() {
              printf("libhdfs smoke test\n");
              printf("libhdfs version compiled successfully\n");

              // Test that we can call hdfsBuilderConnect (will fail without HDFS running, which is OK)
              struct hdfsBuilder *builder = hdfsNewBuilder();
              if (builder) {
                  printf("✅ hdfsNewBuilder() works\n");
                  hdfsFreeBuilder(builder);
              }

              return 0;
          }
          EOF

          # Compile test
          gcc /tmp/test_libhdfs.c -o /tmp/test_libhdfs \
            -I$HOME/libhdfs-artifacts/headers \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/darwin \
            -L$HOME/libhdfs-artifacts/native \
            -lhdfs \
            -Wl,-rpath,$HOME/libhdfs-artifacts/native

          # Run test
          /tmp/test_libhdfs

          echo "✅ libhdfs test passed"

      # ============================================
      # STEP 14: Create minimal package
      # ============================================
      - name: Create libhdfs package
        run: |
          cd $HOME/libhdfs-artifacts

          # Create build info
          cat > BUILD_INFO.txt << EOF
          Hadoop libhdfs Build Information
          ================================
          Hadoop Version: ${HADOOP_VERSION}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Build Platform: macOS Intel (x86_64)
          Build Java: ${JAVA_BUILD_VERSION}
          Runtime Java: ${JAVA_RUNTIME_VERSION}
          Protocol Buffers: ${PROTOBUF_VERSION}
          Build Type: Minimal (libhdfs only)
          GitHub Run: ${{ github.run_number }}

          Contents:
          - native/libhdfs.dylib - HDFS C API library
          - native/libhadoop.* - Hadoop native library
          - headers/*.h - C header files
          - jars/*.jar - Required Java JARs

          Usage:
            export HADOOP_HOME=/path/to/libhdfs
            export CLASSPATH=\$(find \$HADOOP_HOME/jars -name "*.jar" | tr '\n' ':')
            export DYLD_LIBRARY_PATH=\$HADOOP_HOME/native:\$JAVA_HOME/lib/server

            gcc your_app.c -I\$HADOOP_HOME/headers \\
                -I\$JAVA_HOME/include \\
                -I\$JAVA_HOME/include/darwin \\
                -L\$HADOOP_HOME/native -lhdfs
          EOF

          # Create tar.gz
          tar -czf libhdfs-${HADOOP_VERSION}-macos-intel-x86_64.tar.gz \
            native/ headers/ jars/ BUILD_INFO.txt

          # Create checksums
          shasum -a 256 libhdfs-${HADOOP_VERSION}-macos-intel-x86_64.tar.gz > \
            libhdfs-${HADOOP_VERSION}-macos-intel-x86_64.tar.gz.sha256

          echo "=== Package created ==="
          ls -lh *.tar.gz*

      # ============================================
      # STEP 15: Show space savings
      # ============================================
      - name: Show disk space savings
        run: |
          echo "=== Disk Space Report ==="
          echo ""
          echo "Package size:"
          ls -lh $HOME/libhdfs-artifacts/*.tar.gz
          echo ""
          echo "Total artifacts size:"
          du -sh $HOME/libhdfs-artifacts
          echo ""
          echo "Full Hadoop source size:"
          du -sh $HOME/hadoop-src
          echo ""
          echo "Disk usage:"
          df -h /
          echo ""
          echo "=== Space saved by building only libhdfs ==="
          echo "Instead of ~500MB full Hadoop distribution,"
          echo "libhdfs package is only a few MB!"

      # ============================================
      # STEP 16: Upload artifacts
      # ============================================
      - name: Upload libhdfs package
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-${{ env.HADOOP_VERSION }}-macos-intel-x86_64
          path: |
            $HOME/libhdfs-artifacts/*.tar.gz
            $HOME/libhdfs-artifacts/*.sha256
            $HOME/libhdfs-artifacts/BUILD_INFO.txt
          retention-days: 30

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-native-only-${{ env.HADOOP_VERSION }}
          path: $HOME/libhdfs-artifacts/native/
          retention-days: 30

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-headers-${{ env.HADOOP_VERSION }}
          path: $HOME/libhdfs-artifacts/headers/
          retention-days: 30

      - name: Upload build logs (if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-build-logs
          path: |
            $HOME/hadoop-src/build-*.log
          retention-days: 7

      # ============================================
      # STEP 17: Summary
      # ============================================
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ libhdfs Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Hadoop Version:** ${{ env.HADOOP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** Minimal (libhdfs only)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** macOS Intel (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Build:** ${{ env.JAVA_BUILD_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Runtime:** ${{ env.JAVA_RUNTIME_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhdfs.dylib\` - HDFS C API library" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhadoop.dylib/a\` - Hadoop native library" >> $GITHUB_STEP_SUMMARY
          echo "- C header files" >> $GITHUB_STEP_SUMMARY
          echo "- Required Java JARs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Size" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh $HOME/libhdfs-artifacts/*.tar.gz | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Extract package" >> $GITHUB_STEP_SUMMARY
          echo "tar -xzf libhdfs-${{ env.HADOOP_VERSION }}-macos-intel-x86_64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Setup environment" >> $GITHUB_STEP_SUMMARY
          echo "export HADOOP_HOME=\$(pwd)" >> $GITHUB_STEP_SUMMARY
          echo "export CLASSPATH=\$(find \$HADOOP_HOME/jars -name '*.jar' | tr '\n' ':')" >> $GITHUB_STEP_SUMMARY
          echo "export DYLD_LIBRARY_PATH=\$HADOOP_HOME/native:\$JAVA_HOME/lib/server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
